name: Campanha WhatsApp Diária 7h

on:
  schedule:
    # 0 10 * * * = 10:00 UTC = 07:00 BRT (UTC-3)
    - cron: '0 10 * * *'
  workflow_dispatch:  # permite rodar manualmente

jobs:
  send-telegram:
    runs-on: ubuntu-latest
    steps:
      - name: Enviar mensagem via Telegram Bot API
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          cat << 'EOF' > message.txt
          🤖 *ATIVAR CAMPANHA DO WHATSAPP*

          Bom dia! Hora de ativar a campanha do WhatsApp para Armoire Atelier.

          📱 Ações sugeridas:
          • Enviar broadcast para lista de contatos
          • Postar story com CTA para WhatsApp
          • Responder mensagens pendentes

          #ArmoireAtelier #Goiânia #Marketing
          EOF
          
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d text="$(cat message.txt)" \
            -d parse_mode="Markdown"